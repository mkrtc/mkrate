name: Memory Platform Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/memory-platform-evidence.yml"
      - "bun.lock"
      - "package.json"
      - "packages/core/package.json"
      - "packages/core/tsconfig.json"
      - "packages/shared/package.json"
      - "packages/shared/tsconfig.json"
      - "packages/server-core/package.json"
      - "packages/server-core/tsconfig.json"
      - "packages/shared/src/credentials/**"
      - "packages/shared/src/project-memory/**"
      - "packages/server-core/src/handlers/rpc/projects.ts"
      - "packages/server-core/src/handlers/rpc/projects-memory.test.ts"
      - "packages/server-core/src/sessions/SessionManager.ts"
      - "packages/server-core/src/sessions/session-memory-reconciliation.test.ts"
      - "packages/server-core/src/sessions/session-memory-runtime.ts"
      - "packages/server-core/src/sessions/session-memory-runtime.test.ts"
      - "scripts/memory-platform-evidence*.ts"
      - "scripts/__tests__/memory-platform-evidence-lib.test.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/memory-platform-evidence.yml"
      - "bun.lock"
      - "package.json"
      - "packages/core/package.json"
      - "packages/core/tsconfig.json"
      - "packages/shared/package.json"
      - "packages/shared/tsconfig.json"
      - "packages/server-core/package.json"
      - "packages/server-core/tsconfig.json"
      - "packages/shared/src/credentials/**"
      - "packages/shared/src/project-memory/**"
      - "packages/server-core/src/handlers/rpc/projects.ts"
      - "packages/server-core/src/handlers/rpc/projects-memory.test.ts"
      - "packages/server-core/src/sessions/SessionManager.ts"
      - "packages/server-core/src/sessions/session-memory-reconciliation.test.ts"
      - "packages/server-core/src/sessions/session-memory-runtime.ts"
      - "packages/server-core/src/sessions/session-memory-runtime.test.ts"
      - "scripts/memory-platform-evidence*.ts"
      - "scripts/__tests__/memory-platform-evidence-lib.test.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-platform-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: memory evidence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup exact Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Collect memory evidence
        env:
          CI: "true"
          MEMORY_EVIDENCE_OUTPUT_DIR: ${{ runner.temp }}/memory-platform-evidence
        run: bun run memory:evidence

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memory-platform-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/memory-platform-evidence/*
          if-no-files-found: error
          retention-days: 30
